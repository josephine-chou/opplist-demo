{% extends "base.html" %}
{# H2: a 413 on any form - the browser keeps what she typed, so Back is enough #}
{% block title %}{{ t.too_large_title }}{% endblock %}
{% block content %}
<h1>{{ t.too_large_title }}</h1>
<p>{{ t.too_large.format(size_mb) }}</p>
<p><a href="javascript:history.back()">{{ t.too_large_back }}</a></p>
{% endblock %}
